<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film Stock Timeline — 1916 to 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <svg class="logo-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-label="Film reel icon">
          <circle cx="18" cy="18" r="16" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="6" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="7" r="2.5" fill="currentColor"/>
          <circle cx="18" cy="29" r="2.5" fill="currentColor"/>
          <circle cx="7" cy="18" r="2.5" fill="currentColor"/>
          <circle cx="29" cy="18" r="2.5" fill="currentColor"/>
          <circle cx="10.5" cy="10.5" r="2.5" fill="currentColor"/>
          <circle cx="25.5" cy="25.5" r="2.5" fill="currentColor"/>
          <circle cx="25.5" cy="10.5" r="2.5" fill="currentColor"/>
          <circle cx="10.5" cy="25.5" r="2.5" fill="currentColor"/>
          <circle cx="18" cy="18" r="2" fill="currentColor"/>
        </svg>
        <div>
          <h1 class="site-title">Century of Film</h1>
          <p class="site-subtitle">An Interactive Film Stock Timeline · 1916–2026</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="stats-btn" id="statsToggle" aria-label="Toggle statistics">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="4" height="12"/><rect x="9" y="5" width="4" height="16"/><rect x="16" y="1" width="4" height="20"/></svg>
          Stats
        </button>
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- STATS PANEL -->
  <div class="stats-panel" id="statsPanel" aria-hidden="true">
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-bar" role="search" aria-label="Filter film stocks">
    <div class="controls-inner">

      <!-- Search + filter toggle row -->
      <div class="controls-top-row">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search stock name, brand…" aria-label="Search film stocks"/>
          <button class="clear-search" id="clearSearch" aria-label="Clear search" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="filter-toggle-btn" id="filterToggle" aria-expanded="true" aria-controls="filtersPane">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          <span class="filter-toggle-label">Filters</span>
          <span class="filter-active-count" id="filterActiveCount" hidden>0</span>
          <svg class="filter-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
      </div>

      <!-- Filters pane (collapsible) -->
      <div class="filters-pane" id="filtersPane">
      <div class="filters-row">

        <!-- Type filter -->
        <div class="filter-group">
          <span class="filter-label">Type</span>
          <div class="btn-group" role="group" aria-label="Filter by type">
            <button class="filter-btn active" data-filter="type" data-value="all">All</button>
            <button class="filter-btn" data-filter="type" data-value="color">
              <span class="dot color-dot"></span>Color
            </button>
            <button class="filter-btn" data-filter="type" data-value="bw">
              <span class="dot bw-dot"></span>B&W
            </button>
          </div>
        </div>

        <!-- Brand filter -->
        <div class="filter-group">
          <span class="filter-label">Brand</span>
          <div class="btn-group brand-group" role="group" aria-label="Filter by brand">
            <button class="filter-btn active" data-filter="brand" data-value="all">All</button>
            <button class="filter-btn brand-kodak" data-filter="brand" data-value="Kodak">Kodak</button>
            <button class="filter-btn brand-ilford" data-filter="brand" data-value="Ilford">Ilford</button>
            <button class="filter-btn brand-agfa" data-filter="brand" data-value="Agfa">Agfa</button>
            <button class="filter-btn brand-ansco" data-filter="brand" data-value="Ansco">Ansco</button>
            <button class="filter-btn brand-fuji" data-filter="brand" data-value="Fujifilm">Fuji</button>
            <button class="filter-btn brand-3m" data-filter="brand" data-value="3M">3M</button>
            <button class="filter-btn brand-konica" data-filter="brand" data-value="Konica">Konica</button>
            <button class="filter-btn brand-ferrania" data-filter="brand" data-value="Film Ferrania">Ferrania</button>
            <button class="filter-btn brand-harman" data-filter="brand" data-value="Harman">Harman</button>
            <button class="filter-btn brand-lomo" data-filter="brand" data-value="Lomography">Lomo</button>
            <button class="filter-btn brand-shanghai" data-filter="brand" data-value="Shanghai">Shanghai</button>
            <button class="filter-btn brand-polaroid" data-filter="brand" data-value="Polaroid">Polaroid</button>
            <button class="filter-btn brand-impossible" data-filter="brand" data-value="Impossible Project">Impossible</button>
            <button class="filter-btn brand-other" data-filter="brand" data-value="other">Other</button>
          </div>
        </div>

        <!-- Speed filter -->
        <div class="filter-group">
          <span class="filter-label">Speed</span>
          <div class="btn-group" role="group" aria-label="Filter by ISO speed">
            <button class="filter-btn active" data-filter="speed" data-value="all">All</button>
            <button class="filter-btn" data-filter="speed" data-value="slow">≤ 50</button>
            <button class="filter-btn" data-filter="speed" data-value="medium">64–200</button>
            <button class="filter-btn" data-filter="speed" data-value="fast">250–640</button>
            <button class="filter-btn" data-filter="speed" data-value="ultrafast">800+</button>
            <button class="filter-btn" data-filter="speed" data-value="unknown">Unlisted</button>
          </div>
        </div>

        <!-- Subtype filter -->
        <div class="filter-group">
          <span class="filter-label">Format</span>
          <div class="btn-group" role="group" aria-label="Filter by film subtype">
            <button class="filter-btn active" data-filter="subtype" data-value="all">All</button>
            <button class="filter-btn" data-filter="subtype" data-value="Negative">Negative</button>
            <button class="filter-btn" data-filter="subtype" data-value="Reversal">Reversal</button>
            <button class="filter-btn" data-filter="subtype" data-value="Print">Print</button>
            <button class="filter-btn" data-filter="subtype" data-value="Specialty">Specialty</button>
            <button class="filter-btn" data-filter="subtype" data-value="Instant">Instant</button>
          </div>
        </div>

        <!-- View toggle -->
        <div class="filter-group view-group">
          <span class="filter-label">View</span>
          <div class="btn-group" role="group" aria-label="View mode">
            <button class="filter-btn active" id="viewTimeline">Timeline</button>
            <button class="filter-btn" id="viewGrid">Grid</button>
          </div>
        </div>

      </div>
      </div><!-- /filters-pane -->
    </div>
  </div>

  <!-- LANDSCAPE HINT (mobile portrait only, shown via JS) -->
  <div class="landscape-hint" id="landscapeHint" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 2h2a2 2 0 0 1 2 2v1"/>
      <path d="M8 2H6a2 2 0 0 0-2 2v1"/>
    </svg>
    Rotate to landscape for a wider timeline view
  </div>

  <!-- RESULT COUNT -->
  <div class="result-bar">
    <span id="resultCount" class="result-count">Loading…</span>
    <button class="reset-all" id="resetAll">Reset filters</button>
  </div>

  <!-- TIMELINE RULER (fixed overlay — scroll-synced via JS) -->
  <div class="timeline-ruler-fixed" id="timelineRulerFixed" aria-hidden="true">
    <div class="timeline-ruler" id="timelineRuler"></div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <!-- TIMELINE VIEW -->
    <div id="timelineView" class="timeline-view">
      <div class="timeline-ruler-spacer" id="timelineRulerSpacer"></div>
      <div class="timeline-eras" id="timelineEras"></div>
      <div class="timeline-lanes" id="timelineLanes">
        <!-- Lanes for brands, generated by JS -->
      </div>
    </div>

    <!-- GRID VIEW -->
    <div id="gridView" class="grid-view hidden">
      <div class="grid-container" id="gridContainer"></div>
    </div>

  </main>

  <!-- DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close detail panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- NO RESULTS -->
  <div class="no-results" id="noResults" hidden>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg>
    <p>No film stocks match your current filters.</p>
    <button class="reset-all" id="resetAll2">Clear filters</button>
  </div>

  <script src="data.js"></script>
  <script src="photos.js"></script>
  <script src="thumbnails.js"></script>
  <script src="app.js"></script>
<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
</script></body>
</html>
